name: CI
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Tests - ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        group: [core, flow, wells, backends, solvers, partitioned, thermal, compositional, adjoint_parameters, adjoint_controls]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/install-juliaup@v3
        with:
          channel: release
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-run-testitems@v2
        with:
          filter: ':ci_${{ matrix.group }} in tags'
          juliaup-channel: release
          max-workers: '1'
          threads: '1'
          check-bounds: 'yes'
          gc-between-testitems: 'true'
          results-path: test-results-${{ matrix.group }}.json
          coverage-lcov-path: lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.group }}
          path: test-results-${{ matrix.group }}.json
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: lcov.info
          flags: ${{ matrix.group }}
  test-report:
    name: Test results
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true
      - uses: julia-actions/julia-report-ci-results@v2
        with:
          results-path: test-results
  mpi:
    name: MPI (2 ranks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate MPI test environment
        run: julia --project=test/mpi -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run MPI regression test
        run: julia --project=test/mpi test/mpi/run.jl
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      JUTULDARCY_DOCS_EXAMPLE_WORKERS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Add GLMakie/XFVB dependencies
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
      - name: Checkout
        uses: actions/checkout@v4
      - name: Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Julia cache
        uses: julia-actions/cache@v2
      - name: "BuildPkg"
        uses: julia-actions/julia-buildpkg@v1
      - name: Instantiate documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Check example prebuild pipeline
        run: xvfb-run -a julia --project=docs docs/test/runtests.jl
      - name: Prebuild Literate examples
        run: xvfb-run -a julia --project=docs docs/make.jl --examples-only
      - name: Build and deploy documentation
        run: xvfb-run -a julia --project=docs docs/make.jl --docs-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Link PR documentation preview
        if: >-
          github.event_name == 'pull_request' &&
          github.repository == 'sintefmath/JutulDarcy.jl' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const comment = require('./.github/scripts/doc-preview.cjs');
            await comment({ github, context, core });
      - name: Upload example build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-example-logs
          path: docs/example_logs/
      - name: Doc build
        run: |
          DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using JutulDarcy
            DocMeta.setdocmeta!(JutulDarcy, :DocTestSetup, :(using JutulDarcy); recursive=true)
            doctest(JutulDarcy)'
