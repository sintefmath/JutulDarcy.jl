name: CI
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test-prepare:
    name: Prepare checked test environment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JULIA_CPU_TARGET: generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      OPENBLAS_NUM_THREADS: '1'
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-key }}
      cache-paths: ${{ steps.cache.outputs.cache-paths }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure the shared test depot
        run: echo "JULIA_DEPOT_PATH=$RUNNER_TEMP/jutuldarcy-test-depot:" >> "$GITHUB_ENV"
      - uses: julia-actions/install-juliaup@v3
        with:
          channel: release
      - name: Record the exact Julia version
        id: julia-version
        run: julia --startup-file=no -e 'println("version=", VERSION)' >> "$GITHUB_OUTPUT"
      - uses: julia-actions/cache@v2
        id: cache
        with:
          cache-name: jutuldarcy-tests-checked-v1-julia-${{ steps.julia-version.outputs.version }}
          include-matrix: 'false'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Prepare the full test sandbox with the groups' compilation flags
        uses: julia-actions/julia-run-testitems@v2
        with:
          filter: ':infrastructure in tags'
          juliaup-channel: release
          max-workers: '1'
          threads: '1'
          check-bounds: 'yes'
          coverage: 'true'
          env: '{"JULIA_DEPOT_PATH":"${{ runner.temp }}/jutuldarcy-test-depot:","JULIA_NUM_PRECOMPILE_TASKS":"2","OPENBLAS_NUM_THREADS":"1"}'
      - name: Share the resolved package manifest
        uses: actions/upload-artifact@v4
        with:
          name: checked-test-manifest
          path: Manifest.toml
          if-no-files-found: error
  test:
    name: Tests - ${{ matrix.group }}
    runs-on: ubuntu-latest
    needs: test-prepare
    timeout-minutes: 30
    env:
      JULIA_CPU_TARGET: generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      OPENBLAS_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        group: [core, flow, wells, backends, solvers, partitioned, thermal, compositional, adjoint_parameters, adjoint_controls]
    steps:
      - uses: actions/checkout@v4
      - name: Configure the shared test depot
        run: echo "JULIA_DEPOT_PATH=$RUNNER_TEMP/jutuldarcy-test-depot:" >> "$GITHUB_ENV"
      - uses: julia-actions/install-juliaup@v3
        with:
          channel: release
      - name: Restore the prepared test environment
        uses: actions/cache/restore@v4
        with:
          path: ${{ needs.test-prepare.outputs.cache-paths }}
          key: ${{ needs.test-prepare.outputs.cache-key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: checked-test-manifest
          path: .
      - uses: julia-actions/julia-run-testitems@v2
        with:
          filter: ':ci_${{ matrix.group }} in tags'
          juliaup-channel: release
          max-workers: '1'
          threads: '1'
          check-bounds: 'yes'
          gc-between-testitems: 'true'
          # This sandbox is already prepared. A prolonged reactivation should
          # report its captured diagnostics before the whole job times out.
          activation-timeout: '600'
          results-path: test-results-${{ matrix.group }}.json
          coverage-lcov-path: lcov.info
          env: '{"JULIA_DEPOT_PATH":"${{ runner.temp }}/jutuldarcy-test-depot:","JULIA_NUM_PRECOMPILE_TASKS":"2","OPENBLAS_NUM_THREADS":"1"}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.group }}
          path: test-results-${{ matrix.group }}.json
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: lcov.info,parray-lcov.info
          flags: ${{ matrix.group }}
  test-report:
    name: Test results
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true
      - uses: julia-actions/julia-report-ci-results@v2
        with:
          results-path: test-results
  mpi:
    name: MPI (2 ranks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/install-juliaup@v3
        with:
          channel: release
      - uses: julia-actions/cache@v2
      - name: Instantiate MPI test environment
        run: julia --project=test/mpi -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run MPI regression test
        run: julia --project=test/mpi test/mpi/run.jl
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      JUTULDARCY_DOCS_EXAMPLE_WORKERS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Add GLMakie/XFVB dependencies
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
      - name: Checkout
        uses: actions/checkout@v4
      - name: Julia
        uses: julia-actions/install-juliaup@v3
        with:
          channel: release
      - name: Julia cache
        uses: julia-actions/cache@v2
      - name: "BuildPkg"
        uses: julia-actions/julia-buildpkg@v1
      - name: Instantiate documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Check example prebuild pipeline
        run: xvfb-run -a julia --project=docs docs/test/runtests.jl
      - name: Prebuild Literate examples
        run: xvfb-run -a julia --project=docs docs/make.jl --examples-only
      - name: Build and deploy documentation
        run: xvfb-run -a julia --project=docs docs/make.jl --docs-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Link PR documentation preview
        if: >-
          github.event_name == 'pull_request' &&
          github.repository == 'sintefmath/JutulDarcy.jl' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const comment = require('./.github/scripts/doc-preview.cjs');
            await comment({ github, context, core });
      - name: Upload example build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-example-logs
          path: docs/example_logs/
      - name: Doc build
        run: |
          DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using JutulDarcy
            DocMeta.setdocmeta!(JutulDarcy, :DocTestSetup, :(using JutulDarcy); recursive=true)
            doctest(JutulDarcy)'
